<html>
<head>
<title>{$lang->pm_edit_title}</title>
{$headerinclude}
</head>
<body>
{$header}
<table border="0" cellspacing="{$theme['borderwidth']}" cellpadding="{$theme['tablespace']}" class="tborder">
<tr>
<td class="thead" colspan="2"><strong>{$lang->pm_edit_title}</strong></td>
</tr>
<tr>
<td class="trow1" colspan="2">
<form action="private.php?action=do_editpm" method="post" name="pmedit">
<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
<input type="hidden" name="pmid" value="{$pmid}" />
<table border="0" cellspacing="{$theme['borderwidth']}" cellpadding="{$theme['tablespace']}" width="100%">
<tr>
<td class="trow2" width="20%"><strong>{$lang->subject}</strong></td>
<td class="trow2" width="80%"><input type="text" class="textbox" name="subject" size="50" maxlength="120" value="{$subject}" /></td>
</tr>
<tr>
<td class="trow1" valign="top"><strong>{$lang->message}</strong></td>
<td class="trow1">
{$codebuttons}
<textarea name="message" id="pmeditmessage" rows="15" cols="70" class="textarea">{$message}</textarea>
</td>
</tr>
{$editreason_field}
<tr>
<td class="trow2" colspan="2" align="center">
<input type="submit" class="button" name="submit" value="{$lang->pm_edit_update}" />
<input type="button" class="button" onclick="window.location='private.php?action=read&amp;pmid={$pmid}'" value="{$lang->pm_edit_cancel}" />
</td>
</tr>
</table>
</form>
</td>
</tr>
</table>
{$footer}
</body>
</html>
