<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PM Edit for MyBB</title>
  <desc id="desc">A MyBB private message editor with quick editing, revision history, and administrator logs.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b35"/>
      <stop offset="1" stop-color="#1b3156"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70e1d0"/>
      <stop offset="1" stop-color="#51a7f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#071126" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#background)"/>
  <circle cx="1050" cy="70" r="210" fill="#4e8cf2" opacity=".08"/>
  <circle cx="100" cy="570" r="230" fill="#5be0c7" opacity=".06"/>
  <path d="M0 470C230 390 360 560 600 475s360-80 600-5v160H0Z" fill="#132543" opacity=".55"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="76" y="76" width="48" height="48" rx="15" fill="url(#accent)"/>
    <path d="M91 91h18a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5h-7l-6 5v-5h-5a5 5 0 0 1-5-5V96a5 5 0 0 1 5-5Z" fill="#10213d"/>
    <path d="m99 99 7-7m-6 2 4 4" fill="none" stroke="#10213d" stroke-width="2.5" stroke-linecap="round"/>

    <text x="142" y="106" fill="#d5e4fa" font-size="16" font-weight="700" letter-spacing="2.4">MYBB PLUGIN</text>
    <text x="76" y="230" fill="#ffffff" font-size="66" font-weight="750" letter-spacing="-2.5">PM Edit</text>
    <text x="78" y="277" fill="#c0d0e8" font-size="23" font-weight="450">More control over every private message.</text>

    <g transform="translate(78 331)">
      <rect width="226" height="44" rx="22" fill="#ffffff" opacity=".09" stroke="#ffffff" stroke-opacity=".13"/>
      <circle cx="23" cy="22" r="5" fill="#67dfc9"/>
      <text x="39" y="28" fill="#e2ecfa" font-size="14" font-weight="600">EDIT · REVIEW · MANAGE</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="635" y="103" width="486" height="411" rx="24" fill="#f7f9fd"/>
      <path d="M659 103h438a24 24 0 0 1 24 24v45H635v-45a24 24 0 0 1 24-24Z" fill="#edf2f9"/>
      <circle cx="665" cy="136" r="5" fill="#ff7e7e"/>
      <circle cx="684" cy="136" r="5" fill="#ffc45b"/>
      <circle cx="703" cy="136" r="5" fill="#57c995"/>
      <text x="733" y="142" fill="#55647c" font-size="13" font-weight="700">PRIVATE MESSAGE</text>
      <rect x="1022" y="121" width="75" height="29" rx="14" fill="#e0f7f2"/>
      <text x="1040" y="140" fill="#167c71" font-size="11" font-weight="700">EDITED</text>

      <text x="674" y="206" fill="#1d2b42" font-size="21" font-weight="700">A quick update</text>
      <text x="674" y="235" fill="#718097" font-size="13">To: Jordan · Today, 10:42 AM</text>
      <rect x="674" y="258" width="351" height="12" rx="6" fill="#dce4ef"/>
      <rect x="674" y="281" width="399" height="12" rx="6" fill="#dce4ef"/>
      <rect x="674" y="304" width="302" height="12" rx="6" fill="#dce4ef"/>
      <rect x="674" y="338" width="135" height="39" rx="10" fill="url(#accent)"/>
      <path d="M692 358h15m-4-5 5 5-5 5" fill="none" stroke="#10213d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="717" y="363" fill="#10213d" font-size="13" font-weight="700">Edit message</text>

      <rect x="674" y="401" width="409" height="85" rx="14" fill="#f0f5fb"/>
      <circle cx="697" cy="425" r="7" fill="#4eab9c"/>
      <text x="714" y="430" fill="#31425c" font-size="13" font-weight="700">EDIT HISTORY</text>
      <text x="694" y="458" fill="#718097" font-size="12">Side-by-side revisions and edit reasons</text>
      <path d="M1043 423h17m-8-8 8 8-8 8" fill="none" stroke="#7a8aa2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(895 465)" filter="url(#shadow)">
      <rect width="258" height="92" rx="17" fill="#ffffff"/>
      <rect x="18" y="18" width="35" height="35" rx="11" fill="#e8efff"/>
      <path d="M28 28h15v14H28zm3-4v8m9-8v8" fill="none" stroke="#537be3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="35" fill="#34445e" font-size="12" font-weight="700">ADMIN CP LOGS</text>
      <text x="65" y="57" fill="#7a879a" font-size="11">Browse · inspect · manage</text>
      <circle cx="226" cy="27" r="4" fill="#62ceb2"/>
    </g>

    <text x="78" y="570" fill="#9fb3d0" font-size="13" font-weight="600">Edit sent &amp; received PMs  ·  Quick edit  ·  Revision history  ·  ACP log viewer</text>
  </g>
</svg>
